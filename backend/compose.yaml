services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: construction_saas
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d construction_saas"]
      interval: 2s
      timeout: 2s
      retries: 20
