services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: construction_saas
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d construction_saas"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: app-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
volumes:
  minio-data:
