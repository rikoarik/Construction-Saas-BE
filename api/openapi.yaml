                  as_of_date: { type: string, format: date }
                  budget_version_id: { type: string, format: uuid }
                  baseline_id: { type: string, format: uuid }
                  planned_cumulative_pct: { $ref: '#/components/schemas/DecimalString' }
                  actual_cumulative_pct: { $ref: '#/components/schemas/DecimalString' }
                  deviation_pp: { $ref: '#/components/schemas/DecimalString' }
                  updated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
