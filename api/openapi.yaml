        '200': { description: Report rejected without ledger posting. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reports/{reportId}/approve:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [reports]
      operationId: approveDailyReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_revision]
              properties:
                report_revision: { type: integer, minimum: 1 }
                comment: { type: string }
      responses:
        '200':
          description: Approval advanced; final approval posts the ledger exactly once.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [under_review, approved] }
