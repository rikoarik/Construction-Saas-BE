  /integrations/telegram/miniapp-session:
    post:
      tags: [telegram]
      operationId: createTelegramMiniAppSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data: { type: string, minLength: 1, writeOnly: true }
      responses:
        '200': { description: Session bootstrap after signed initData verification. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /integrations/telegram/webhook:
    post:
      tags: [telegram]
      operationId: telegramWebhook
      security: []
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Update accepted or safely deduplicated. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { description: Request body exceeds configured maximum. }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  requestBodies:
    CreateCompany:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/CompanyEditable' }
              - type: object
                required: [code, name, admin_email]
    UpdateCompany:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              legal_name: { type: [string, 'null'], maxLength: 200 }
              contact_email: { type: [string, 'null'], format: email }
              phone: { type: [string, 'null'], maxLength: 40 }
              address: { type: [string, 'null'], maxLength: 1000 }
              timezone: { type: string }
              plan_id: { type: [string, 'null'], format: uuid }
    InviteCompanyAdmin:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties: { email: { type: string, format: email } }
    AdminStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties: { status: { type: string, enum: [active, suspended] } }
    EmailInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    TokenInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
    MfaCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, minLength: 1, maxLength: 64 }
    NotificationKeys:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [keys]
            properties:
              keys:
                type: array
                minItems: 1
                maxItems: 100
                description: Notification keys from the list endpoint, for example `process:42` or `company:6f1c2b9e-….` Duplicates collapse, so repeated keys do not count twice against the bound of 100 unique keys per request.
                items: { type: string, pattern: '^(process|company|subscription):[A-Za-z0-9-]{1,64}$' }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  parameters:
    CompanyLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DashboardRange:
      name: range
      in: query
      schema: { type: string, enum: [7d, 30d, 90d, 12m] }
    DashboardLimit5:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 5 }
    DashboardLimit10:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    DashboardOffset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    NotificationLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
      description: Session-bound token from GET /auth/csrf.
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BaselineId:
      name: baselineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    CompanyEditable:
      type: object
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_-]{1,39}$', description: Creation only; immutable thereafter. }
        name: { type: string, minLength: 1, maxLength: 200 }
        legal_name: { type: [string, 'null'], maxLength: 200 }
        contact_email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 40 }
        address: { type: [string, 'null'], maxLength: 1000 }
        timezone: { type: string, description: Valid IANA timezone, default UTC on creation. }
        plan_id: { type: [string, 'null'], format: uuid, description: Existing plan ID, optional. }
        admin_email: { type: string, format: email, description: Required on creation; not editable. }
    ManagedCompanyData:
      type: object
      required: [id, code, name, legal_name, contact_email, phone, address, timezone, plan_id, subscription_plan, status, access_version, created_at, updated_at, last_activity_at, suspended_reason, suspended_by, suspended_at, member_count, project_count]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        legal_name: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        timezone: { type: string }
        plan_id: { type: [string, 'null'], format: uuid }
        subscription_plan: { type: [string, 'null'] }
        status: { type: string, enum: [provisioning, active, suspended, archived] }
        access_version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_activity_at: { type: [string, 'null'], format: date-time }
        suspended_reason: { type: [string, 'null'] }
        suspended_by: { type: [string, 'null'], format: uuid }
        suspended_at: { type: [string, 'null'], format: date-time }
        member_count: { type: integer, format: int64 }
        project_count: { type: integer, format: int64 }
    ManagedCompanyPage:
      type: object
      required: [items, limit, offset, total, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManagedCompanyData' } }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, format: int64 }
        has_more: { type: boolean }
    CompanyAdminData:
      type: object
      required: [user_id, email, role, status, created_at, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin] }
        status: { type: string, enum: [active, suspended, removed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyInvitationData:
      type: object
      required: [id, email, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    PlatformPeriod:
      type: object
      required: [range, start, end]
      properties:
        range: { type: string, enum: [7d, 30d, 90d, 12m] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    PlatformMetric:
      type: object
      required: [value, previous, series]
      properties:
        value: { type: [integer, 'null'], format: int64 }
        previous: { type: [integer, 'null'], format: int64 }
        series:
          type: [array, 'null']
          description: One point per UTC bucket of the selected period, oldest first. Company and user series are cumulative totals at each bucket; the failed-jobs series counts failures per bucket. Null means the history cannot be reconstructed from stored data.
          items: { type: integer, format: int64, minimum: 0 }
    PlatformDashboardData:
      type: object
      required: [period, companies, users, active_projects, failed_jobs]
      properties:
        period: { $ref: '#/components/schemas/PlatformPeriod' }
        companies: { $ref: '#/components/schemas/PlatformMetric' }
        users: { $ref: '#/components/schemas/PlatformMetric' }
        active_projects: { $ref: '#/components/schemas/PlatformMetric' }
        failed_jobs: { $ref: '#/components/schemas/PlatformMetric' }
    PlatformGrowthData:
      type: object
      required: [period, points]
      properties:
        period: { $ref: '#/components/schemas/PlatformPeriod' }
        points:
          type: array
          items:
            type: object
            required: [start, new_companies, total_companies]
            properties:
              start: { type: string, format: date-time }
              new_companies: { type: integer, format: int64 }
              total_companies: { type: integer, format: int64 }
    PlatformStatusData:
      type: object
      description: Percentages use the confirmed company total as denominator; all are 0 when total is 0.
      required: [active, suspended, archived, total, active_percent, suspended_percent, archived_percent]
      properties:
        active: { type: integer, format: int64 }
        suspended: { type: integer, format: int64 }
        archived: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        active_percent: { type: number, minimum: 0, maximum: 100 }
        suspended_percent: { type: number, minimum: 0, maximum: 100 }
        archived_percent: { type: number, minimum: 0, maximum: 100 }
    PlatformCompanyData:
      type: object
      required: [id, name, status, created_at, subscription_plan, member_count, project_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [provisioning, active, suspended, archived] }
        created_at: { type: string, format: date-time }
        subscription_plan: { type: [string, 'null'], description: Name of the current plan; null when the company has no current subscription. }
        member_count: { type: integer, format: int64 }
        project_count: { type: [integer, 'null'], format: int64, description: Every project of the company, including closed ones. }
    PlatformJobData:
      type: object
      required: [id, company_id, company_name, type, status, error_code, created_at, failed_at, available_at, attempts, retry_eligible]
      properties:
        id: { type: integer, format: int64, description: Existing outbox identity, not a UUID. }
        company_id: { type: [string, 'null'], format: uuid }
        company_name: { type: [string, 'null'] }
        type: { type: string }
        status: { type: string, enum: [failed, retry_pending] }
        error_code: { type: [string, 'null'], enum: [JOB_EXECUTION_FAILED, null], description: Safe classification for new worker failures; null for legacy or unclassified records. }
        created_at: { type: string, format: date-time }
        failed_at: { type: [string, 'null'], format: date-time }
        available_at: { type: string, format: date-time }
        attempts: { type: integer }
        retry_eligible: { type: boolean, description: False until a safe, audited manual retry facility exists. }
    PlatformActivityData:
      type: object
      required: [id, type, company_id, occurred_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [company.registered, company.suspended, company.reactivated, subscription.changed, job.failed] }
        company_id: { type: [string, 'null'], format: uuid }
        occurred_at: { type: string, format: date-time }
    PlatformCompanyPage:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformCompanyData' } }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    PlatformJobPage:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformJobData' } }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    PlatformActivityPage:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformActivityData' } }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    PlatformNotificationData:
      type: object
      description: |
        One derived feed entry. Type, severity, event_type, and error_code are
        machine values; the frontend renders every human-readable string from its
        own locale, so the API never ships prose. `key` is stable for the lifetime
        of the underlying record and is what the mark-read endpoints accept.
      required: [key, type, severity, company_id, company_name, event_type, error_code, plan, occurred_at, read]
      properties:
        key:
          type: string
          pattern: '^(process|company|subscription):[A-Za-z0-9-]{1,64}$'
        type: { type: string, enum: [process_failed, process_retry, company_suspended, subscription_past_due] }
        severity: { type: string, enum: [error, warning] }
        company_id: { type: [string, 'null'], format: uuid }
        company_name: { type: [string, 'null'] }
        event_type: { type: [string, 'null'], description: Outbox event type; null for company and subscription entries. }
        error_code: { type: [string, 'null'], description: Recorded outbox error code; null when the failure has none. }
        plan: { type: [string, 'null'], description: Current plan name; null unless the entry is a past-due subscription. }
        occurred_at: { type: string, format: date-time, description: Time of the failure, suspension, or past-due transition. }
        read: { type: boolean, description: Whether this operator has marked the entry read. }
    PlatformNotificationPage:
      type: object
      required: [items, unread, type, read]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PlatformNotificationData' } }
        unread:
          type: integer
          format: int64
          description: Operator's total unread count, independent of the active filter.
        type: { type: string, enum: ['', process, company, subscription], description: The filter that produced this page. }
        read: { type: string, enum: ['', unread, read], description: The filter that produced this page. }
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      examples: ['19.04']
    Company:
      type: object
      required: [id, name, slug, status, role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended] }
        role: { type: string, enum: [owner, admin, member, viewer] }
        created_at: { type: string, format: date-time }
    CompanyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Company' } }
        next_cursor: { type: [string, 'null'] }
    Member:
      type: object
      required: [user_id, email, role, status, created_at, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, suspended, removed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemberPage:
      type: object
      required: [members]
      properties:
        members: { type: array, items: { $ref: '#/components/schemas/Member' } }
    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member, viewer] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationPage:
      type: object
      required: [invitations]
      properties:
        invitations: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
    Page:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        next_cursor: { type: [string, 'null'] }
    CreateReport:
      type: object
      required: [report_date, entries]
      properties:
        report_date: { type: string, format: date }
        entries:
          type: array
          items:
            type: object
            required: [work_item_id, measure_kind]
            properties:
              work_item_id: { type: string, format: uuid }
              location_id: { type: [string, 'null'], format: uuid }
              measure_kind: { type: string, enum: [quantity] }
              quantity_delta: { $ref: '#/components/schemas/DecimalString' }
              notes: { type: string }
        attachment_ids:
          type: array
          items: { type: string, format: uuid }
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, PLATFORM_PERMISSION_DENIED, MFA_REQUIRED, NOT_FOUND, CONFLICT, BUSINESS_RULE_VIOLATION, RATE_LIMITED, INTERNAL_ERROR]
        params: { type: object, additionalProperties: true }
  responses:
    ManagedCompany:
      description: Company metadata and authoritative counts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ManagedCompanyData' }
    ManagedCompanies:
      description: Filtered company metadata with deterministic ordering.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ManagedCompanyPage' }
    CompanyUsage:
      description: Company usage metadata; last activity is recorded administrative activity, not project activity.
      content:
        application/json:
          schema:
            type: object
            required: [company_id, member_count, project_count, last_activity_at]
            properties:
              company_id: { type: string, format: uuid }
              member_count: { type: integer, format: int64 }
              project_count: { type: integer, format: int64 }
              last_activity_at: { type: [string, 'null'], format: date-time }
    CompanyAdmins:
      description: Administrators and invitation history for this company only.
      content:
        application/json:
          schema:
            type: object
            required: [members, invitations]
            properties:
              members: { type: array, items: { $ref: '#/components/schemas/CompanyAdminData' } }
              invitations: { type: array, items: { $ref: '#/components/schemas/CompanyInvitationData' } }
    CompanyAdmin:
      description: Administrator membership.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CompanyAdminData' }
    CompanyInvitation:
      description: Invitation metadata; token never returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CompanyInvitationData' }
    CompanyMissing:
      description: COMPANY_NOT_FOUND or MEMBER_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvitationMissing:
      description: COMPANY_NOT_FOUND or INVITATION_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CompanyConflict:
      description: COMPANY_CODE_CONFLICT, COMPANY_STATUS_CONFLICT, INVITATION_CONFLICT, IDEMPOTENCY_CONFLICT, or LAST_COMPANY_ADMIN.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PlatformOperator:
      description: Verified operator context.
      content:
        application/json:
          schema:
            type: object
            required: [user_id, capabilities, mfa_verified]
            properties:
              user_id: { type: string, format: uuid }
              capabilities: { type: array, items: { type: string } }
              mfa_verified: { type: boolean, const: true }
    PlatformDashboard:
      description: Platform counts; null denotes unimplemented data sources rather than zero.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformDashboardData' }
    PlatformGrowth:
      description: UTC registration buckets.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformGrowthData' }
    PlatformStatus:
      description: Company lifecycle counts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformStatusData' }
    PlatformCompanies:
      description: Recent company metadata.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformCompanyPage' }
    PlatformJobs:
      description: Failed outbox metadata.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformJobPage' }
    PlatformActivities:
      description: Sanitized operational activities.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformActivityPage' }
    PlatformNotifications:
      description: Derived notification feed with the operator's read state. An empty list is a confirmed empty feed, not unavailable data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformNotificationPage' }
    PlatformDistribution:
      description: Current subscriptions grouped by plan name. An empty list is a confirmed empty distribution.
      content:
        application/json:
          schema:
            type: object
            required: [available, items]
            properties:
              available: { type: boolean }
              items:
                type: array
                items:
                  type: object
                  required: [plan, companies]
                  properties:
                    plan: { type: string }
                    companies: { type: integer, format: int64 }
    PlatformStorage:
      description: |
        Storage accounting has no authoritative source, so used_bytes stays null.
        A configured storage quota is reported separately; otherwise quota_bytes
        is null and quota_state is unknown. api_requests reports requests recorded
        in the current UTC month, against a
        platform-wide monthly quota from configuration. used is null until the
        first request is recorded — unmetered traffic is unavailable, not a
        confirmed zero — and limit is null when no quota is configured.
      content:
        application/json:
          schema:
            type: object
            required: [used_bytes, quota_bytes, quota_state, api_requests]
            properties:
              used_bytes: { type: [integer, 'null'], format: int64 }
              quota_bytes: { type: [integer, 'null'], format: int64 }
              quota_state: { type: string, enum: [unknown, unlimited, limited] }
              api_requests:
                type: [object, 'null']
                required: [used, limit]
                properties:
                  used: { type: [integer, 'null'], format: int64 }
                  limit: { type: [integer, 'null'], format: int64 }
    PlatformIntegrations:
      description: Operational signals only; unknown is not healthy.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [name, status, checked_at]
              properties:
                name: { type: string, enum: [telegram, email, object_storage, worker] }
                status: { type: string, enum: [healthy, degraded, unavailable, unknown] }
                checked_at: { type: [string, 'null'], format: date-time }
    MfaResult:
      description: MFA completed and session cookie rotated. Enrollment returns recovery codes once.
      content:
        application/json:
          schema:
            type: object
            required: [expires_at]
            properties:
              expires_at: { type: string, format: date-time }
              recovery_codes: { type: array, items: { type: string } }
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The operation is not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource was not found or is not visible.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with current or previously processed state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BusinessRuleViolation:
      description: Request violates a business invariant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error:
      description: Stable machine-readable error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - sessionCookie: []
