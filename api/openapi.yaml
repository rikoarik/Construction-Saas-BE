openapi: 3.1.0
info:
  title: Construction SaaS API
  version: 1.0.0-draft
  description: >-
    Machine-readable API contract. Platform company administration, dashboard
    reads, and identity/session endpoints described here are implemented; other
    domain paths remain draft and do not imply those routes are available.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; replace before deployment.
tags:
  - name: auth
  - name: companies
  - name: projects
  - name: budgets
  - name: planning
  - name: reports
  - name: progress
  - name: documents
  - name: telegram
  - name: platform-dashboard
  - name: platform-companies
paths:
  /platform/me:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformDashboardOperator
      description: Requires an active server-side session, MFA verification, platform access and platform.dashboard.read. Does not grant tenant content access.
      responses:
        '200': { $ref: '#/components/responses/PlatformOperator' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/dashboard:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformDashboard
      description: Requires platform.dashboard.read and verified MFA. Null means unavailable. Company/user previous totals use registration timestamps at the prior period boundary; failed_jobs.previous counts jobs still failed or retry-pending whose last failure occurred in the preceding period; delivered jobs are excluded. Failed-job values are null when legacy dead letters lack failure timestamps, so complete period counts cannot be established. active_projects.value counts projects whose current status is active; its previous value and series are always null because project status history is not recorded. Every series holds one point per UTC bucket of the period, oldest first; company and user series are cumulative totals, the failed-jobs series counts failures per bucket.
      parameters: [{ $ref: '#/components/parameters/DashboardRange' }]
      responses:
        '200': { $ref: '#/components/responses/PlatformDashboard' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/dashboard/company-growth:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformCompanyGrowth
      description: Requires platform.dashboard.read and verified MFA. Default range is 12m. UTC calendar buckets, including partial boundary buckets.
      parameters: [{ $ref: '#/components/parameters/DashboardRange' }]
      responses:
        '200': { $ref: '#/components/responses/PlatformGrowth' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/dashboard/company-status:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformCompanyStatus
      description: Requires platform.dashboard.read and verified MFA. Provisioning companies are included in total but not active, suspended, or archived counts.
      responses:
        '200': { $ref: '#/components/responses/PlatformStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/dashboard/activities:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformActivities
      description: Requires platform.dashboard.read and verified MFA. Only allowlisted operational event types; no raw audit metadata.
      parameters: [{ $ref: '#/components/parameters/DashboardLimit10' }, { $ref: '#/components/parameters/DashboardOffset' }]
      responses:
        '200': { $ref: '#/components/responses/PlatformActivities' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/dashboard/subscription-distribution:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformSubscriptionDistribution
      description: Requires platform.dashboard.read and verified MFA. Companies grouped by their current subscription plan. A canceled or absent subscription is excluded, so the list can be empty while available is true.
      responses:
        '200': { $ref: '#/components/responses/PlatformDistribution' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/dashboard/storage-usage:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformStorageUsage
      description: Requires platform.dashboard.read and verified MFA. Storage accounting and quotas are currently unavailable; API request counts are measured.
      responses:
        '200': { $ref: '#/components/responses/PlatformStorage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/dashboard/integration-health:
    get:
      tags: [platform-dashboard]
      operationId: getPlatformIntegrationHealth
      description: Requires platform.dashboard.read and verified MFA. Email delivery failures indicate degraded delivery. A worker heartbeat newer than 30 seconds establishes process liveness, not provider delivery; absent or stale heartbeat yields unknown. Telegram and object storage remain unknown without operational probes.
      responses:
        '200': { $ref: '#/components/responses/PlatformIntegrations' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/companies:
    get:
      tags: [platform-companies]
      operationId: listPlatformCompanies
      description: Requires platform.company.read and verified MFA. Metadata only; last_activity_at is the latest recorded audit event or null, never inferred from project activity.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [provisioning, active, suspended, archived] } }
        - { name: plan_id, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: ['-created_at', created_at, name, '-name', code, '-code'], default: '-created_at' } }
        - { $ref: '#/components/parameters/CompanyLimit' }
        - { $ref: '#/components/parameters/DashboardOffset' }
      responses:
        '200': { $ref: '#/components/responses/ManagedCompanies' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [platform-companies]
      operationId: createPlatformCompany
      description: Requires platform.company.create, MFA and CSRF. Creates a provisioning company, its first Admin invitation, audit and email outbox atomically. The company becomes active when the first invitation is accepted.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateCompany' }
      responses:
        '201': { $ref: '#/components/responses/ManagedCompany' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/CompanyConflict' }
  /platform/companies/{companyId}:
    get:
      tags: [platform-companies]
      operationId: getPlatformCompany
      description: Requires platform.company.read, MFA. Metadata only.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }]
      responses:
        '200': { $ref: '#/components/responses/ManagedCompany' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
    patch:
      tags: [platform-companies]
      operationId: updatePlatformCompany
      description: Requires platform.company.update, MFA and CSRF. Archived companies cannot be edited. Null fields are ignored.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/UpdateCompany' }
      responses:
        '200': { $ref: '#/components/responses/ManagedCompany' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
        '409': { $ref: '#/components/responses/CompanyConflict' }
  /platform/companies/{companyId}/suspend:
    post:
      tags: [platform-companies]
      operationId: suspendPlatformCompany
      description: Requires platform.company.suspend, MFA and CSRF. Only active to suspended; immediately denies workspace access without deleting data.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
      responses:
        '200': { $ref: '#/components/responses/ManagedCompany' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
        '409': { $ref: '#/components/responses/CompanyConflict' }
  /platform/companies/{companyId}/reactivate:
    post:
      tags: [platform-companies]
      operationId: reactivatePlatformCompany
      description: Requires platform.company.reactivate, MFA and CSRF. Only suspended to active; existing memberships remain unchanged.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { $ref: '#/components/responses/ManagedCompany' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
        '409': { $ref: '#/components/responses/CompanyConflict' }
  /platform/companies/{companyId}/usage:
    get:
      tags: [platform-companies]
      operationId: getPlatformCompanyUsage
      description: Requires platform.company.read and MFA. Counts only; no tenant project content.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }]
      responses:
        '200': { $ref: '#/components/responses/CompanyUsage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
  /platform/companies/{companyId}/members:
    get:
      tags: [platform-companies]
      operationId: getPlatformCompanyAdmins
      description: Requires platform.member.read and MFA. Returns Admin and owner memberships and invitation status only.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }]
      responses:
        '200': { $ref: '#/components/responses/CompanyAdmins' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
  /platform/companies/{companyId}/invitations:
    post:
      tags: [platform-companies]
      operationId: invitePlatformCompanyAdmin
      description: Requires platform.member.invite, MFA and CSRF. One pending invitation per company/email; retries return INVITATION_CONFLICT and do not enqueue another email.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/InviteCompanyAdmin' }
      responses:
        '201': { $ref: '#/components/responses/CompanyInvitation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
        '409': { $ref: '#/components/responses/CompanyConflict' }
  /platform/companies/{companyId}/invitations/{invitationId}/resend:
    post:
      tags: [platform-companies]
      operationId: resendPlatformCompanyAdminInvitation
      description: Requires platform.member.invite, MFA and CSRF. Rotates the token and invalidates the old queued email in one transaction.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/InvitationId' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { $ref: '#/components/responses/CompanyInvitation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/InvitationMissing' }
        '409': { $ref: '#/components/responses/CompanyConflict' }
  /platform/companies/{companyId}/invitations/{invitationId}:
    delete:
      tags: [platform-companies]
      operationId: cancelPlatformCompanyAdminInvitation
      description: Requires platform.member.revoke, MFA and CSRF.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/InvitationId' }, { $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Invitation revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/InvitationMissing' }
  /platform/companies/{companyId}/members/{userId}:
    patch:
      tags: [platform-companies]
      operationId: setPlatformCompanyAdminStatus
      description: Requires platform.member.revoke, MFA and CSRF. A company row lock protects the last active Admin from concurrent deactivation.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/AdminStatus' }
      responses:
        '200': { $ref: '#/components/responses/CompanyAdmin' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CompanyMissing' }
        '409': { $ref: '#/components/responses/CompanyConflict' }
  /platform/jobs:
    get:
      tags: [platform-dashboard]
      operationId: listPlatformDashboardJobs
      description: Requires platform.dashboard.read and verified MFA. Failed outbox events include historic dead letters with null failed_at; retry_pending requires a recorded failure timestamp.
      parameters:
        - name: status
          in: query
          schema: { type: string, default: 'failed,retry_pending', pattern: '^(failed|retry_pending|failed,retry_pending|retry_pending,failed)$', description: One or both distinct statuses; comma-separated. }
        - { $ref: '#/components/parameters/DashboardLimit5' }
        - { $ref: '#/components/parameters/DashboardOffset' }
      responses:
        '200': { $ref: '#/components/responses/PlatformJobs' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/notifications:
    get:
      tags: [platform-dashboard]
      operationId: listPlatformNotifications
      description: |
        Requires platform.dashboard.read and verified MFA. Entries are derived on
        read from records the platform already keeps: outbox events that are dead
        (including legacy dead letters without a recorded failure time) or
        retry-pending with a recorded failure, suspended companies, and past-due
        subscriptions. Nothing is copied into a notification table, so a
        recovered job simply stops appearing. `unread` is the operator's total
        unread count and does not change when a filter is applied; `type` and
        `read` echo the filter that produced the page. Read markers belong to the
        authenticated operator only.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: ['', process, company, subscription], description: Empty means every type. `process` covers both failed and retry-pending jobs. }
        - name: read
          in: query
          schema: { type: string, enum: ['', unread, read], description: Empty means both read and unread. }
        - { $ref: '#/components/parameters/NotificationLimit' }
      responses:
        '200': { $ref: '#/components/responses/PlatformNotifications' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/notifications/read:
    post:
      tags: [platform-dashboard]
      operationId: markPlatformNotificationsRead
      description: |
        Requires platform.dashboard.read, verified MFA, and a CSRF token. Keys are
        notification keys previously returned by the list endpoint. Unknown but
        well-formed keys are accepted, because an entry can disappear between the
        read and the mark; duplicate keys collapse. Marking is idempotent.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/NotificationKeys' }
      responses:
        '204': { description: Markers stored. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/notifications/unread:
    post:
      tags: [platform-dashboard]
      operationId: markPlatformNotificationsUnread
      description: Requires platform.dashboard.read, verified MFA, and a CSRF token. Clears read markers so the entries count as unread again.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/NotificationKeys' }
      responses:
        '204': { description: Markers cleared. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/notifications/read-all:
    post:
      tags: [platform-dashboard]
      operationId: markAllPlatformNotificationsRead
      description: Requires platform.dashboard.read, verified MFA, and a CSRF token. Marks every entry that currently exists for the operator; markers are not stored for entries the operator never saw.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Every current entry marked read. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/session:
    get:
      tags: [auth]
      operationId: getPlatformSession
      description: Requires an active platform grant and an MFA-verified session; it does not grant tenant access.
      responses:
        '200':
          description: Verified platform access and capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, mfa_verified, capabilities]
                properties:
                  authenticated: { type: boolean, const: true }
                  mfa_verified: { type: boolean, const: true }
                  capabilities: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Platform access is disabled until MFA is available. }
  /auth/mfa/enrollment:
    post:
      tags: [auth]
      operationId: startMfaEnrollment
      description: Requires an MFA-pending platform session and CSRF token.
      responses:
        '200':
          description: One-time TOTP enrollment secret.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url, expires_at]
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/mfa/enrollment/confirm:
    post:
      tags: [auth]
      operationId: confirmMfaEnrollment
      requestBody: { $ref: '#/components/requestBodies/MfaCode' }
      responses:
        '200': { $ref: '#/components/responses/MfaResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/mfa/challenge:
    post:
      tags: [auth]
      operationId: challengeMfa
      requestBody: { $ref: '#/components/requestBodies/MfaCode' }
      responses:
        '200': { $ref: '#/components/responses/MfaResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/mfa/recovery:
    post:
      tags: [auth]
      operationId: recoverMfa
      requestBody: { $ref: '#/components/requestBodies/MfaCode' }
      responses:
        '200': { $ref: '#/components/responses/MfaResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      requestBody: { $ref: '#/components/requestBodies/EmailInput' }
      responses:
        '202': { description: Accepted regardless of account existence. }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      security: []
      requestBody: { $ref: '#/components/requestBodies/EmailInput' }
      responses:
        '202': { description: Accepted regardless of account existence. }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 1024, writeOnly: true }
      responses:
        '204': { description: Password changed and sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      security: []
      requestBody: { $ref: '#/components/requestBodies/TokenInput' }
      responses:
        '204': { description: Email verified. }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      description: Existing accounts must authenticate as the invited user; new accounts require a password. No session is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: Invitation accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, user_id]
                properties:
                  accepted: { type: boolean, const: true }
                  user_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Session established; platform administrators must complete the indicated MFA step.
          content:
            application/json:
              schema:
                type: object
                required: [next]
                properties:
                  next: { type: string, enum: [authenticated, mfa_required, mfa_enrollment_required] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      description: Rotate an active session token without extending its absolute expiration. Requires a session-bound CSRF token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session cookie rotated; the old token is invalid. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      description: Current account for an active session. MFA-pending sessions are denied.
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  selected_company:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [id, name, role]
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          role: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      responses:
        '200':
          description: Active sessions belonging to the current user.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, created_at, expires_at, current]
                      properties:
                        id: { type: string, format: uuid }
                        created_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        current: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Session revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found. }
  /auth/companies:
    get:
      tags: [auth]
      operationId: listMyCompanies
      responses:
        '200':
          description: Active companies for which the user has active membership.
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies:
                    type: array
                    items:
                      type: object
                      required: [id, name, role]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        role: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/companies/select:
    post:
      tags: [auth]
      operationId: selectCompany
      description: Select an active company membership for this session. Selection is not a grant; authorization must be checked on each request.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [company_id]
              properties:
                company_id: { type: string, format: uuid }
      responses:
        '204': { description: Company selected. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      description: Requires the current password and a session-bound CSRF token. On success all sessions are revoked and the cookie is cleared.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, writeOnly: true }
                new_password: { type: string, writeOnly: true, minLength: 8, maxLength: 1024 }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      responses:
        '204': { description: All sessions revoked and current cookie cleared. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Current session revoked and cookie cleared. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200':
          description: Session-bound token for an active or MFA-pending session, or a pre-authentication double-submit token for anonymous requests; response is no-store.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: { type: string, minLength: 32 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /companies:
    post:
      tags: [companies]
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                slug: { type: string, minLength: 1, maxLength: 120, pattern: '^[a-z0-9][a-z0-9-]*$' }
      responses:
        '201':
          description: Company and initial owner membership created atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [companies]
      operationId: listCompanies
      responses:
        '200':
          description: Companies where the caller has active membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /companies/{companyId}/invitations:
